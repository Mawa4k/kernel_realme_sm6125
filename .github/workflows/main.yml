name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==========================================
      # 2. Fix Git safe directory
      # ==========================================
      - name: Configure Git
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "=== Git ==="
          git rev-parse --short HEAD
          git branch --show-current

      # ==========================================
      # 3. Install build dependencies
      # ==========================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libelf-dev \
            libdw-dev \
            ccache \
            zip \
            unzip \
            git \
            wget \
            curl \
            rsync \
            python3 \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf

      # ==========================================
      # 4. Show toolchain
      # ==========================================
      - name: Check toolchain
        run: |
          set -eux

          echo "=== Clang ==="
          clang --version

          echo
          echo "=== LLVM ==="
          llvm-config --version

          echo
          echo "=== LLD ==="
          ld.lld --version

          echo
          echo "=== AArch64 GCC ==="
          aarch64-linux-gnu-gcc --version

      # ==========================================
      # 5. Download MemKernel
      # ==========================================
      - name: Download MemKernel setup script
        run: |
          set -eux

          curl -fL \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" \
            -o setup.sh

          echo "=== Checking setup.sh ==="
          bash -n setup.sh

      # ==========================================
      # 6. Setup MemKernel
      # ==========================================
      - name: Set up MemKernel
        run: |
          set -eux

          bash setup.sh M

      # ==========================================
      # 7. Verify MemKernel
      # ==========================================
      - name: Verify MemKernel
        run: |
          set -eux

          echo "=== MemKernel directories ==="
          find . \
            -type d \
            -iname '*memkernel*' \
            -print || true

          echo
          echo "=== MemKernel files ==="
          find . \
            -type f \
            \( \
              -iname '*memkernel*' \
              -o -iname '*memk*' \
            \) \
            -print | head -100 || true

          echo
          echo "=== Git changes ==="
          git status --short || true

      # ==========================================
      # 8. Check defconfig
      # ==========================================
      - name: Check kernel defconfig
        run: |
          set -eux

          echo "=== Available ARM64 defconfigs ==="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -name '*defconfig' \
            -printf '%f\n' \
            | sort

          echo
          echo "=== Checking r5x_defconfig ==="

          if [ ! -f "arch/arm64/configs/r5x_defconfig" ]; then
            echo "ERROR: r5x_defconfig does not exist."
            echo
            echo "Available defconfigs:"
            find arch/arm64/configs \
              -type f \
              -name '*defconfig' \
              -print \
              | sort
            exit 1
          fi

          echo "r5x_defconfig found."

      # ==========================================
      # 9. Prepare build directory
      # ==========================================
      - name: Prepare build directory
        run: |
          set -eux

          rm -rf out
          mkdir -p out

      # ==========================================
      # 10. Generate kernel config
      # ==========================================
      - name: Generate kernel config
        run: |
          set -eux

          make \
            O=out \
            ARCH=arm64 \
            r5x_defconfig

      # ==========================================
      # 11. Enable module support
      # ==========================================
      - name: Configure modules
        run: |
          set -eux

          if [ -x "./scripts/config" ]; then

            ./scripts/config \
              --file out/.config \
              -e CONFIG_MODULES \
              -e CONFIG_MODULE_UNLOAD \
              -e CONFIG_MODULE_FORCE_LOAD \
              -e CONFIG_MODULE_FORCE_UNLOAD \
              -d CONFIG_MODULE_SIG \
              -d CONFIG_MODULE_SIG_FORCE \
              -d CONFIG_MODULE_SIG_ALL

            make \
              O=out \
              ARCH=arm64 \
              olddefconfig

          fi

          echo
          echo "=== Module configuration ==="

          grep -E \
            'CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_FORCE|CONFIG_MODULE_SIG' \
            out/.config || true

      # ==========================================
      # 12. Build kernel
      # ==========================================
      - name: Build Android Kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-

          echo "=== Starting kernel build ==="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            2>&1 | tee kernel-build.log

      # ==========================================
      # 13. Find kernel Image
      # ==========================================
      - name: Find built kernel
        run: |
          set -eux

          echo "=== Kernel images ==="

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'Image.gz-dtb' \
              -o -name 'zImage' \
              -o -name 'zImage-dtb' \
            \) \
            -print || true

      # ==========================================
      # 14. Find modules
      # ==========================================
      - name: Find built modules
        run: |
          set -eux

          echo "=== All .ko modules ==="

          find out \
            -type f \
            -name '*.ko' \
            -print \
            | sort || true

          echo
          echo "=== MemKernel modules ==="

          find out \
            -type f \
            \( \
              -name '*memk*.ko' \
              -o -name '*memkernel*.ko' \
            \) \
            -print \
            | sort || true

      # ==========================================
      # 15. Prepare artifacts
      # ==========================================
      - name: Prepare build output
        run: |
          set -eux

          mkdir -p build_output

          echo "=== Copy kernel images ==="

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'Image.gz-dtb' \
              -o -name 'zImage' \
              -o -name 'zImage-dtb' \
            \) \
            -exec cp {} build_output/ \; \
            || true

          echo
          echo "=== Copy all kernel modules ==="

          find out \
            -type f \
            -name '*.ko' \
            -exec cp {} build_output/ \; \
            || true

          echo
          echo "=== Build output ==="

          ls -lah build_output/

      # ==========================================
      # 16. Upload artifacts
      # ==========================================
      - name: Upload Kernel and Modules
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-Kernel-Build
          path: |
            build_output/**
            kernel-build.log
            out/.config
          if-no-files-found: warn
