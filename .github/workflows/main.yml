name: Realme 5i Kernel LKM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Checkout kernel source
      # =========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # 2. Configure Git
      # =========================================================
      - name: Configure Git
        shell: bash
        run: |
          set -eux

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # =========================================================
      # 3. Install build dependencies
      # =========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            git \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            lld \
            llvm \
            lzop \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # 4. Show toolchain
      # =========================================================
      - name: Show toolchain
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             TOOLCHAIN"
          echo "=========================================="

          clang --version
          ld.lld --version
          llvm-as --version
          aarch64-linux-gnu-gcc --version

      # =========================================================
      # 5. Detect r5x defconfig
      # =========================================================
      - name: Detect kernel defconfig
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "       AVAILABLE ARM64 DEFCONFIGS"
          echo "=========================================="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if [ -f "arch/arm64/configs/r5x_defconfig" ]; then

            DEFCONFIG="r5x_defconfig"

          elif [ -f "arch/arm64/configs/vendor/r5x_defconfig" ]; then

            DEFCONFIG="vendor/r5x_defconfig"

          else

            echo "ERROR: r5x_defconfig was not found."
            exit 1

          fi

          echo
          echo "Using defconfig: $DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Generate base kernel configuration
      # =========================================================
      - name: Generate kernel configuration
        shell: bash
        run: |
          set -eux

          mkdir -p out

          echo "=========================================="
          echo "       GENERATING KERNEL CONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

      # =========================================================
      # 7. Configure kernel modules
      # =========================================================
      - name: Configure kernel modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "       ENABLING KERNEL MODULE SUPPORT"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_MODULE_FORCE_UNLOAD

          echo
          echo "=========================================="
          echo "       DISABLING MODULE SIGNATURE"
          echo "=========================================="

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG \
            --disable CONFIG_MODULE_SIG_FORCE \
            --disable CONFIG_MODULE_SIG_ALL

          echo
          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      # =========================================================
      # 8. Verify module configuration
      # =========================================================
      - name: Verify module configuration
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "       FINAL MODULE CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^CONFIG_(MODULES|MODULE_FORCE_LOAD|MODULE_UNLOAD|MODULE_FORCE_UNLOAD|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL)=' \
            out/.config \
            || true

          echo
          echo "=========================================="
          echo "       CHECKING REQUIRED OPTIONS"
          echo "=========================================="

          grep -q '^CONFIG_MODULES=y$' out/.config

          grep -q '^CONFIG_MODULE_FORCE_LOAD=y$' out/.config

          grep -q '^CONFIG_MODULE_UNLOAD=y$' out/.config

          grep -q '^CONFIG_MODULE_FORCE_UNLOAD=y$' out/.config

          if grep -q '^CONFIG_MODULE_SIG=y$' out/.config; then
            echo "ERROR: CONFIG_MODULE_SIG=y"
            exit 1
          fi

          if grep -q '^CONFIG_MODULE_SIG_FORCE=y$' out/.config; then
            echo "ERROR: CONFIG_MODULE_SIG_FORCE=y"
            exit 1
          fi

          if grep -q '^CONFIG_MODULE_SIG_ALL=y$' out/.config; then
            echo "ERROR: CONFIG_MODULE_SIG_ALL=y"
            exit 1
          fi

          echo
          echo "MODULE CONFIGURATION OK"

      # =========================================================
      # 9. Show all configured modules
      # =========================================================
      - name: Show configured kernel modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             CONFIGURED MODULES"
          echo "=========================================="

          grep '=m$' out/.config || true

      # =========================================================
      # 10. Build Android kernel
      # =========================================================
      - name: Build Android kernel
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "          BUILDING ANDROID KERNEL"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            2>&1 | tee kernel-build.log

      # =========================================================
      # 11. Build kernel modules
      # =========================================================
      - name: Build kernel modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             BUILDING MODULES"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules \
            -j"$(nproc)" \
            2>&1 | tee modules-build.log

      # =========================================================
      # 12. Verify kernel image
      # =========================================================
      - name: Verify kernel image
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             KERNEL OUTPUT"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "ERROR: Image was not generated."
            exit 1
          fi

          echo
          echo "Kernel Image exists."

      # =========================================================
      # 13. Verify generated .ko files
      # =========================================================
      - name: Verify generated KO modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "              MODPOST"
          echo "=========================================="

          grep -E \
            'Building modules|MODPOST' \
            kernel-build.log \
            modules-build.log \
            || true

          echo
          echo "=========================================="
          echo "          GENERATED .KO FILES"
          echo "=========================================="

          find out \
            -type f \
            -name "*.ko" \
            -print \
            | sort

          KO_COUNT="$(find out -type f -name '*.ko' | wc -l)"

          echo
          echo "Total .ko files: $KO_COUNT"

          if [ "$KO_COUNT" -eq 0 ]; then

            echo
            echo "=========================================="
            echo "       ERROR: NO .KO WAS GENERATED"
            echo "=========================================="

            echo
            echo "Configured modules:"

            grep '=m$' out/.config || true

            echo
            echo "MODPOST output:"

            grep -E \
              'MODPOST|ERROR|warning' \
              kernel-build.log \
              modules-build.log \
              || true

            exit 1

          fi

          echo
          echo "=========================================="
          echo "       .KO MODULE BUILD SUCCESS"
          echo "=========================================="

      # =========================================================
      # 14. Show module information
      # =========================================================
      - name: Show module information
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             MODULE INFORMATION"
          echo "=========================================="

          find out \
            -type f \
            -name "*.ko" \
            -print \
            | while read -r KO; do

              echo
              echo "------------------------------------------"
              echo "MODULE: $KO"
              echo "------------------------------------------"

              file "$KO" || true

              modinfo "$KO" || true

            done

      # =========================================================
      # 15. Collect kernel and modules
      # =========================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -eux

          rm -rf build_output

          mkdir -p \
            build_output/kernel \
            build_output/modules

          echo "=========================================="
          echo "          COLLECTING KERNEL"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "Image-dtb" \
            \) \
            -exec cp -v {} build_output/kernel/ \;

          echo
          echo "=========================================="
          echo "          COLLECTING .KO MODULES"
          echo "=========================================="

          find out \
            -type f \
            -name "*.ko" \
            -exec cp -v {} build_output/modules/ \;

          echo
          echo "=========================================="
          echo "          COLLECTING CONFIG"
          echo "=========================================="

          cp \
            out/.config \
            build_output/kernel/config

          echo
          echo "=========================================="
          echo "          COLLECTING BUILD LOGS"
          echo "=========================================="

          cp \
            kernel-build.log \
            build_output/

          cp \
            modules-build.log \
            build_output/

          echo
          echo "=========================================="
          echo "             FINAL OUTPUT"
          echo "=========================================="

          find build_output \
            -type f \
            -printf '%p\n' \
            | sort

      # =========================================================
      # 16. Upload artifacts
      # =========================================================
      - name: Upload Kernel and LKM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-Kernel-LKM
          path: build_output/
          if-no-files-found: error
          retention-days: 30
