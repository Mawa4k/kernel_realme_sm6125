name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libgdbm-dev liblzma-dev lzop libelf-dev libffi-dev libgmp-dev libmpc-dev libmpfr-dev ccache zip unzip git wget curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download MemKernel setup script
        run: |
          set -e
          curl -fL \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" \
            -o setup.sh
          bash setup.sh M

      - name: Download ZyC Clang Toolchain
        run: |
          mkdir clang
          wget -q https://github.com/ZyC-s/Clang/releases/download/19.0.0-20240409/Clang-19.0.0.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Build Android Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out r5x_defconfig
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Find built Image and Modules
        run: |
          mkdir -p build_output
          find out/arch/arm64/boot/ -type f -name "Image*" -exec cp {} build_output/ \; || true
          find . -type f -name "*.ko" -exec cp {} build_output/ \; || true

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-kernel-build
          path: build_output/
          if-no-files-found: warn
