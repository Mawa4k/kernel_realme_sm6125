```yaml
name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download MemKernel setup script
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" \
            -o setup.sh

          bash -n setup.sh

      - name: Set up MemKernel as module
        shell: bash
        run: |
          set -e
          bash setup.sh M

      - name: Check MemKernel
        shell: bash
        run: |
          echo "=== MemKernel directory ==="
          find . -type d -iname "*memkernel*" -print

          echo "=== MemKernel files ==="
          find . -type f \
            \( -iname "*memkernel*" -o -iname "*memk*" \) \
            -print || true

          echo "=== Kernel Makefile ==="
          grep -n "memkernel" drivers/Makefile 2>/dev/null || true

          echo "=== Kernel Kconfig ==="
          grep -n "memkernel" drivers/Kconfig 2>/dev/null || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            cpio \
            rsync \
            unzip \
            zip \
            device-tree-compiler

      - name: Install Clang
        shell: bash
        run: |
          set -e

          sudo apt-get install -y clang llvm lld

          echo "=== Clang version ==="
          clang --version

          echo "=== LLD version ==="
          ld.lld --version

      - name: Configure kernel
        shell: bash
        run: |
          set -e

          mkdir -p out

          echo "=== Checking defconfig ==="

          if [ -f arch/arm64/configs/r5x_defconfig ]; then
            echo "Found r5x_defconfig"
          else
            echo "ERROR: r5x_defconfig not found"
            find arch/arm64/configs -maxdepth 1 -type f -name "*defconfig" -print
            exit 1
          fi

          make O=out ARCH=arm64 r5x_defconfig

          echo "=== Module configuration ==="
          grep -E \
            'CONFIG_MODULES=|CONFIG_MODULE_UNLOAD=|CONFIG_MODULE_FORCE_LOAD=|CONFIG_MODULE_FORCE_UNLOAD=|CONFIG_MODULE_SIG=' \
            out/.config || true

      - name: Build kernel
        shell: bash
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image.gz-dtb

      - name: Build modules
        shell: bash
        run: |
          set -e

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            modules

      - name: Find kernel and modules
        shell: bash
        run: |
          echo "=== Kernel images ==="
          find out -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) \
            -print

          echo "=== Kernel modules ==="
          find out -type f -name "*.ko" -print | sort

          echo "=== MemKernel modules ==="
          find out -type f -name "*.ko" \
            \( -iname "*memk*" -o -iname "*memkernel*" \) \
            -print || true

      - name: Prepare artifacts
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          find out -type f \
            \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) \
            -exec cp {} artifacts/ \;

          find out -type f -name "*.ko" \
            -exec cp --parents {} artifacts/ \;

          echo "=== Artifacts ==="
          find artifacts -type f -print

      - name: Upload Kernel and Modules
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-kernel-build
          path: artifacts/
          if-no-files-found: error
```
