name: Realme 5i Kernel + MemKernel LKM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Checkout kernel source
      # =========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # 2. Configure Git
      # =========================================================
      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # =========================================================
      # 3. Install build dependencies
      # =========================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            git \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            lld \
            llvm \
            lzop \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # =========================================================
      # 4. Setup Poko-Apps MemKernel
      # =========================================================
      - name: Setup Poko-Apps MemKernel LKM
        shell: bash
        run: |
          set -eux

          echo "===== Downloading MemKernel setup.sh ====="

          curl -fL \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" \
            -o memkernel-setup.sh

          chmod +x memkernel-setup.sh

          echo "===== Running MemKernel setup ====="

          bash memkernel-setup.sh M memk

          echo
          echo "===== MemKernel related files ====="

          find . \
            -type f \
            \( \
              -iname "*memk*" \
              -o \
              -name "Kconfig" \
              -o \
              -name "Makefile" \
            \) \
            -print \
            | head -300

      # =========================================================
      # 5. Detect r5x defconfig
      # =========================================================
      - name: Detect kernel defconfig
        shell: bash
        run: |
          set -eux

          echo "===== Available ARM64 defconfigs ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if [ -f "arch/arm64/configs/r5x_defconfig" ]; then
            DEFCONFIG="r5x_defconfig"

          elif [ -f "arch/arm64/configs/vendor/r5x_defconfig" ]; then
            DEFCONFIG="vendor/r5x_defconfig"

          else
            echo "ERROR: r5x_defconfig not found."
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Generate base kernel config
      # =========================================================
      - name: Generate kernel configuration
        shell: bash
        run: |
          set -eux

          mkdir -p out

          echo "===== Using ====="
          echo "$DEFCONFIG"

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

      # =========================================================
      # 7. Enable required module options
      # =========================================================
      - name: Configure kernel modules
        shell: bash
        run: |
          set -eux

          echo "===== Enabling module support ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_MODULE_FORCE_UNLOAD

          echo
          echo "===== Disabling module signatures ====="

          ./scripts/config \
            --file out/.config \
            --disable CONFIG_MODULE_SIG \
            --disable CONFIG_MODULE_SIG_FORCE \
            --disable CONFIG_MODULE_SIG_ALL

          echo
          echo "===== Running olddefconfig ====="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      # =========================================================
      # 8. Verify required CONFIG values
      # =========================================================
      - name: Verify module configuration
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "       FINAL MODULE CONFIGURATION"
          echo "=========================================="

          grep -E \
            '^CONFIG_(MODULES|MODULE_FORCE_LOAD|MODULE_UNLOAD|MODULE_FORCE_UNLOAD|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL)=' \
            out/.config \
            || true

          echo
          echo "===== Required values ====="

          grep -q '^CONFIG_MODULES=y$' out/.config
          grep -q '^CONFIG_MODULE_FORCE_LOAD=y$' out/.config
          grep -q '^CONFIG_MODULE_UNLOAD=y$' out/.config
          grep -q '^CONFIG_MODULE_FORCE_UNLOAD=y$' out/.config

          if grep -q '^CONFIG_MODULE_SIG=y$' out/.config; then
            echo "ERROR: CONFIG_MODULE_SIG is enabled"
            exit 1
          fi

          if grep -q '^CONFIG_MODULE_SIG_FORCE=y$' out/.config; then
            echo "ERROR: CONFIG_MODULE_SIG_FORCE is enabled"
            exit 1
          fi

          if grep -q '^CONFIG_MODULE_SIG_ALL=y$' out/.config; then
            echo "ERROR: CONFIG_MODULE_SIG_ALL is enabled"
            exit 1
          fi

          echo
          echo "Module configuration OK."

      # =========================================================
      # 9. Inspect MemKernel Kconfig
      # =========================================================
      - name: Inspect MemKernel Kconfig
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "       MEMKERNEL KCONFIG SEARCH"
          echo "=========================================="

          grep -RniE \
            '(memk|MEMK)' \
            . \
            --include='Kconfig*' \
            --include='Makefile' \
            --include='Kbuild' \
            || true

      # =========================================================
      # 10. Find MemKernel CONFIG symbol
      # =========================================================
      - name: Detect MemKernel CONFIG symbol
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "     DETECTING MEMKERNEL CONFIG SYMBOL"
          echo "=========================================="

          SYMBOL="$(
            grep -RhoE \
              '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]*(MEMK|memk)[A-Za-z0-9_]*' \
              . \
              --include='Kconfig*' \
            | sed -E 's/^[[:space:]]*config[[:space:]]+//' \
            | sort -u \
            | head -n 1
          )"

          if [ -z "$SYMBOL" ]; then
            echo "ERROR: MemKernel CONFIG symbol was not detected."
            echo
            echo "===== Kconfig references ====="

            grep -RniE \
              '(memk|MEMK)' \
              . \
              --include='Kconfig*' \
              --include='Makefile' \
              --include='Kbuild' \
              || true

            exit 1
          fi

          echo "Detected symbol:"
          echo "$SYMBOL"

          echo "MEMK_SYMBOL=$SYMBOL" >> "$GITHUB_ENV"

      # =========================================================
      # 11. Force MemKernel to module (=m)
      # =========================================================
      - name: Enable MemKernel as LKM
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "       ENABLING MEMKERNEL AS MODULE"
          echo "=========================================="

          echo "CONFIG symbol: $MEMK_SYMBOL"

          ./scripts/config \
            --file out/.config \
            --module "$MEMK_SYMBOL"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== MemKernel config ====="

          grep \
            "^${MEMK_SYMBOL}=" \
            out/.config

          echo
          echo "===== Module options currently enabled ====="

          grep '=m$' out/.config \
            | head -100 \
            || true

      # =========================================================
      # 12. Verify MemKernel is really =m
      # =========================================================
      - name: Verify MemKernel module configuration
        shell: bash
        run: |
          set -eux

          echo "Checking:"
          echo "$MEMK_SYMBOL"

          if ! grep -q "^${MEMK_SYMBOL}=m$" out/.config; then
            echo
            echo "ERROR: MemKernel is NOT configured as =m"
            echo
            grep \
              "^${MEMK_SYMBOL}=" \
              out/.config \
              || true

            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "${MEMK_SYMBOL}=m"

      # =========================================================
      # 13. Build kernel
      # =========================================================
      - name: Build Android kernel
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=========================================="
          echo "             BUILDING KERNEL"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            2>&1 | tee kernel-build.log

      # =========================================================
      # 14. Build all kernel modules
      # =========================================================
      - name: Build kernel modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             BUILDING MODULES"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules \
            -j"$(nproc)" \
            2>&1 | tee modules-build.log

      # =========================================================
      # 15. Verify MODPOST and .ko
      # =========================================================
      - name: Verify generated KO modules
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "                MODPOST"
          echo "=========================================="

          grep -E \
            'Building modules|MODPOST' \
            kernel-build.log \
            modules-build.log \
            || true

          echo
          echo "=========================================="
          echo "              GENERATED .KO"
          echo "=========================================="

          find out \
            -type f \
            -name "*.ko" \
            -print \
            | sort

          KO_COUNT="$(find out -type f -name '*.ko' | wc -l)"

          echo
          echo "Total .ko files: $KO_COUNT"

          if [ "$KO_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: NO .ko MODULE WAS GENERATED."
            echo
            echo "===== MemKernel CONFIG ====="

            grep \
              "^${MEMK_SYMBOL}=" \
              out/.config \
              || true

            echo
            echo "===== All =m CONFIGS ====="

            grep '=m$' out/.config \
              | head -200 \
              || true

            echo
            echo "===== Last MODPOST lines ====="

            grep -E \
              'MODPOST|ERROR|warning' \
              kernel-build.log \
              modules-build.log \
              | tail -100 \
              || true

            exit 1
          fi

          echo
          echo "SUCCESS: .ko module(s) generated."

      # =========================================================
      # 16. Show module information
      # =========================================================
      - name: Show module information
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "             MODULE INFORMATION"
          echo "=========================================="

          for KO in $(find out -type f -name "*.ko"); do
            echo
            echo "------------------------------------------"
            echo "MODULE: $KO"
            echo "------------------------------------------"

            file "$KO" || true

            if command -v modinfo >/dev/null 2>&1; then
              modinfo "$KO" || true
            fi
          done

      # =========================================================
      # 17. Collect kernel + modules
      # =========================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -eux

          rm -rf build_output

          mkdir -p \
            build_output/kernel \
            build_output/modules

          echo "=========================================="
          echo "          COLLECTING KERNEL"
          echo "=========================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            \( \
              -name "Image" \
              -o \
              -name "Image.gz" \
              -o \
              -name "Image.gz-dtb" \
              -o \
              -name "Image-dtb" \
            \) \
            -exec cp -v {} build_output/kernel/ \;

          echo
          echo "=========================================="
          echo "          COLLECTING MODULES"
          echo "=========================================="

          find out \
            -type f \
            -name "*.ko" \
            -exec cp -v {} build_output/modules/ \;

          echo
          echo "=========================================="
          echo "          COLLECTING CONFIG"
          echo "=========================================="

          cp \
            out/.config \
            build_output/kernel/config

          echo
          echo "=========================================="
          echo "             COLLECTING LOGS"
          echo "=========================================="

          cp \
            kernel-build.log \
            build_output/

          cp \
            modules-build.log \
            build_output/

          echo
          echo "=========================================="
          echo "           FINAL BUILD OUTPUT"
          echo "=========================================="

          find build_output \
            -type f \
            -printf '%p\n' \
            | sort

      # =========================================================
      # 18. Upload artifacts
      # =========================================================
      - name: Upload Kernel and MemKernel Modules
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-Kernel-MemKernel-LKM
          path: build_output/
          if-no-files-found: error
          retention-days: 30
