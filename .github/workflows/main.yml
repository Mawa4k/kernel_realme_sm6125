name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Set up build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libgdbm-dev liblzma-dev lzop libelf-dev libffi-dev libgmp-dev libmpc-dev libmpfr-dev ccache zip unzip git wget curl

      - name: Download MemKernel setup script
        run: |
          set -e
          curl -fL \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" \
            -o setup.sh
          bash setup.sh M

      - name: Download Proton-Clang Toolchain
        run: |
          mkdir clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Build Android Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out r5x_defconfig
          make -j$(nproc --all) O=out

      - name: Find built Image and Modules
        run: |
          mkdir -p build_output
          find out/arch/arm64/boot/ -type f -name "Image*" -exec cp {} build_output/ \; || true
          find . -type f -name "*.ko" -exec cp {} build_output/ \; || true

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-kernel-build
          path: build_output/
          if-no-files-found: warn
