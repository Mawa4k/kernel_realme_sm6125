name: Realme Kernel + MemKernel LKM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Git safe directory
      # ---------------------------------------------------------
      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ---------------------------------------------------------
      # 3. Build dependencies
      # ---------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            git \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            lld \
            llvm \
            lzop \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ---------------------------------------------------------
      # 4. Install MemKernel as LKM
      #
      # M = Loadable Kernel Module
      # ---------------------------------------------------------
      - name: Setup Poko-Apps MemKernel LKM
        shell: bash
        run: |
          set -eux

          curl -fL \
            "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" \
            -o memkernel-setup.sh

          chmod +x memkernel-setup.sh

          # Fixed name makes artifact detection easier
          bash memkernel-setup.sh M memk

          echo "===== MemKernel files ====="

          find . \
            -type f \
            \( -name "*memk*" -o -name "Kconfig" \) \
            -print

      # ---------------------------------------------------------
      # 5. Detect defconfig
      # ---------------------------------------------------------
      - name: Detect kernel defconfig
        shell: bash
        run: |
          set -eux

          echo "===== Available ARM64 defconfigs ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          if [ -f "arch/arm64/configs/r5x_defconfig" ]; then
            echo "DEFCONFIG=r5x_defconfig" >> "$GITHUB_ENV"

          elif [ -f "arch/arm64/configs/vendor/r5x_defconfig" ]; then
            echo "DEFCONFIG=vendor/r5x_defconfig" >> "$GITHUB_ENV"

          else
            echo "ERROR: r5x_defconfig not found."
            exit 1
          fi

          echo "Using: $DEFCONFIG"

      # ---------------------------------------------------------
      # 6. Generate kernel config
      # ---------------------------------------------------------
      - name: Generate kernel configuration
        shell: bash
        run: |
          set -eux

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

      # ---------------------------------------------------------
      # 7. Force module configuration
      # ---------------------------------------------------------
      - name: Enable kernel module support
        shell: bash
        run: |
          set -eux

          # Enable normal LKM support
          ./scripts/config --file out/.config \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_MODULE_FORCE_UNLOAD

          # Disable module signature requirements
          ./scripts/config --file out/.config \
            --disable CONFIG_MODULE_SIG \
            --disable CONFIG_MODULE_SIG_FORCE \
            --disable CONFIG_MODULE_SIG_ALL

          # Recalculate dependencies
          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== MODULE CONFIG ====="

          grep -E \
            '^CONFIG_(MODULES|MODULE_FORCE_LOAD|MODULE_UNLOAD|MODULE_FORCE_UNLOAD|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL)=' \
            out/.config \
            || true

      # ---------------------------------------------------------
      # 8. Detect MemKernel Kconfig symbol
      # ---------------------------------------------------------
      - name: Detect MemKernel config symbol
        shell: bash
        run: |
          set -eux

          echo "===== Searching MemKernel Kconfig ====="

          grep -RniE \
            'config[[:space:]]+[A-Za-z0-9_]*(MEMK|memk)[A-Za-z0-9_]*' \
            . \
            --include='Kconfig*' \
            || true

          echo
          echo "===== Searching MemKernel Makefile ====="

          grep -RniE \
            '(memk|MEMK)' \
            . \
            --include='Makefile' \
            --include='Kbuild' \
            || true

      # ---------------------------------------------------------
      # 9. Automatically force MemKernel symbol = m
      #
      # Finds a CONFIG symbol related to memk from Kconfig,
      # then changes it to module mode.
      # ---------------------------------------------------------
      - name: Enable MemKernel as module
        shell: bash
        run: |
          set -eux

          SYMBOL="$(
            grep -RhoE \
              'config[[:space:]]+[A-Za-z0-9_]*(MEMK|memk)[A-Za-z0-9_]*' \
              . \
              --include='Kconfig*' \
            | awk '{print $2}' \
            | sort -u \
            | head -n 1
          )"

          if [ -z "$SYMBOL" ]; then
            echo "ERROR: Could not automatically detect MemKernel CONFIG symbol."
            echo
            echo "===== Kconfig references ====="
            grep -RniE '(memk|MEMK)' . \
              --include='Kconfig*' \
              --include='Makefile' \
              --include='Kbuild' \
              || true
            exit 1
          fi

          echo "Detected MemKernel CONFIG symbol: $SYMBOL"

          ./scripts/config \
            --file out/.config \
            --module "$SYMBOL"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "===== MemKernel CONFIG RESULT ====="

          grep -E \
            "^${SYMBOL}=" \
            out/.config

      # ---------------------------------------------------------
      # 10. Verify final configuration
      # ---------------------------------------------------------
      - name: Verify final kernel configuration
        shell: bash
        run: |
          set -eux

          echo "===== FINAL CONFIG ====="

          grep -E \
            '^CONFIG_(MODULES|MODULE_FORCE_LOAD|MODULE_UNLOAD|MODULE_FORCE_UNLOAD|MODULE_SIG|MODULE_SIG_FORCE|MODULE_SIG_ALL)=' \
            out/.config \
            || true

          echo
          echo "===== ALL CONFIG OPTIONS SET TO m ====="

          grep '=m$' out/.config | head -100 || true

      # ---------------------------------------------------------
      # 11. Build kernel
      # ---------------------------------------------------------
      - name: Build kernel
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            2>&1 | tee kernel-build.log

      # ---------------------------------------------------------
      # 12. Explicitly build modules
      # ---------------------------------------------------------
      - name: Build kernel modules
        shell: bash
        run: |
          set -eux

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            modules \
            -j"$(nproc)" \
            2>&1 | tee modules-build.log

      # ---------------------------------------------------------
      # 13. Check MODPOST
      # ---------------------------------------------------------
      - name: Verify modules
        shell: bash
        run: |
          set -eux

          echo "===== MODPOST ====="

          grep -E \
            'MODPOST|Building modules' \
            modules-build.log \
            || true

          echo
          echo "===== KO FILES ====="

          find out \
            -type f \
            -name "*.ko" \
            -print \
            | sort

          KO_COUNT="$(find out -type f -name '*.ko' | wc -l)"

          echo
          echo "KO COUNT: $KO_COUNT"

          if [ "$KO_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: No .ko files were generated."
            echo
            echo "===== CONFIG MODULES ====="
            grep '^CONFIG_MODULES=' out/.config || true
            echo
            echo "===== CONFIG =m ====="
            grep '=m$' out/.config | head -100 || true
            exit 1
          fi

      # ---------------------------------------------------------
      # 14. Collect build output
      # ---------------------------------------------------------
      - name: Collect kernel and modules
        shell: bash
        run: |
          set -eux

          rm -rf build_output
          mkdir -p build_output/modules
          mkdir -p build_output/kernel

          # Kernel images
          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            \( \
              -name "Image" \
              -o \
              -name "Image.gz" \
              -o \
              -name "Image.gz-dtb" \
              -o \
              -name "Image-dtb" \
            \) \
            -exec cp -v {} build_output/kernel/ \;

          # All .ko files
          find out \
            -type f \
            -name "*.ko" \
            -exec cp -v {} build_output/modules/ \;

          # Config
          cp out/.config build_output/kernel/config

          # Logs
          cp kernel-build.log build_output/
          cp modules-build.log build_output/

          echo
          echo "===== FINAL ARTIFACTS ====="

          find build_output \
            -type f \
            -printf '%p\n' \
            | sort

      # ---------------------------------------------------------
      # 15. Upload artifacts
      # ---------------------------------------------------------
      - name: Upload Kernel + Modules
        uses: actions/upload-artifact@v4
        with:
          name: Realme5i-Kernel-MemKernel-LKM
          path: build_output/
          if-no-files-found: error
          retention-days: 30
